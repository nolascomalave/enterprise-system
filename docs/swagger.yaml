basePath: /api/v1
definitions:
  enterprise-system_internal_delivery_http_dto.AuthEnvelope:
    properties:
      data:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.AuthTokenResponse'
    type: object
  enterprise-system_internal_delivery_http_dto.AuthTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      requires_2fa:
        type: boolean
      temp_token:
        type: string
      token_type:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  enterprise-system_internal_delivery_http_dto.CreateDepartmentRequest:
    properties:
      code:
        type: string
      manager_party_id:
        type: string
      name:
        type: string
      parent_department_id:
        type: string
    required:
    - code
    - name
    type: object
  enterprise-system_internal_delivery_http_dto.CreateEmployeeRequest:
    properties:
      department_id:
        type: string
      employee_code:
        type: string
      hire_date:
        type: string
      job_id:
        type: string
      manager_party_id:
        type: string
      party_id:
        type: string
      status:
        type: string
    required:
    - department_id
    - employee_code
    - hire_date
    - job_id
    - party_id
    type: object
  enterprise-system_internal_delivery_http_dto.CreateJobRequest:
    properties:
      code:
        type: string
      description:
        type: string
      job_family_id:
        type: string
      max_salary:
        type: string
      min_salary:
        type: string
      title:
        type: string
    required:
    - code
    - job_family_id
    - title
    type: object
  enterprise-system_internal_delivery_http_dto.CreateOrganizationProfileRequest:
    properties:
      legal_name:
        type: string
      tax_id:
        type: string
      trade_name:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.CreatePartyRequest:
    properties:
      display_name:
        type: string
      organization_profile:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.CreateOrganizationProfileRequest'
      party_type:
        enum:
        - INDIVIDUAL
        - ORGANIZATION
        type: string
      person_profile:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.CreatePersonProfileRequest'
    required:
    - display_name
    - party_type
    type: object
  enterprise-system_internal_delivery_http_dto.CreatePersonProfileRequest:
    properties:
      birth_date:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      middle_name:
        type: string
      second_last_name:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.DepartmentEnvelope:
    properties:
      data:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.DepartmentResponse'
    type: object
  enterprise-system_internal_delivery_http_dto.DepartmentListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.DepartmentResponse'
        type: array
    type: object
  enterprise-system_internal_delivery_http_dto.DepartmentResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: string
      manager_party_id:
        type: string
      name:
        type: string
      parent_department_id:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.EmployeeEnvelope:
    properties:
      data:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.EmployeeResponse'
    type: object
  enterprise-system_internal_delivery_http_dto.EmployeeListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.EmployeeResponse'
        type: array
    type: object
  enterprise-system_internal_delivery_http_dto.EmployeeResponse:
    properties:
      created_at:
        type: string
      department_id:
        type: string
      employee_code:
        type: string
      hire_date:
        type: string
      job_id:
        type: string
      manager_party_id:
        type: string
      party_id:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.ErrorResponse:
    properties:
      code:
        example: bad_request
        type: string
      error:
        example: invalid request
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
      tenant_id:
        type: string
    required:
    - email
    - tenant_id
    type: object
  enterprise-system_internal_delivery_http_dto.HealthEnvelope:
    properties:
      data:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.HealthResponse'
    type: object
  enterprise-system_internal_delivery_http_dto.HealthResponse:
    properties:
      service:
        example: enterprise-system
        type: string
      status:
        example: ok
        type: string
      timestamp:
        example: "2026-11-10T12:00:00Z"
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.JobEnvelope:
    properties:
      data:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.JobResponse'
    type: object
  enterprise-system_internal_delivery_http_dto.JobListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.JobResponse'
        type: array
    type: object
  enterprise-system_internal_delivery_http_dto.JobResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      job_family_id:
        type: string
      max_salary:
        type: string
      min_salary:
        type: string
      tenant_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      tenant_id:
        type: string
    required:
    - email
    - password
    - tenant_id
    type: object
  enterprise-system_internal_delivery_http_dto.MergePartiesEnvelope:
    properties:
      data:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.MergePartiesResponse'
    type: object
  enterprise-system_internal_delivery_http_dto.MergePartiesRequest:
    properties:
      source_party_id:
        type: string
      target_party_id:
        type: string
    required:
    - source_party_id
    - target_party_id
    type: object
  enterprise-system_internal_delivery_http_dto.MergePartiesResponse:
    properties:
      compressed_party_ids:
        items:
          type: string
        type: array
      merged_at:
        type: string
      source_id:
        type: string
      target_id:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.MessageEnvelope:
    properties:
      data:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.MessageResponse'
    type: object
  enterprise-system_internal_delivery_http_dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.OrganizationProfileResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      legal_name:
        type: string
      party_id:
        type: string
      tax_id:
        type: string
      trade_name:
        type: string
      updated_at:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.PartyEnvelope:
    properties:
      data:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.PartyResponse'
    type: object
  enterprise-system_internal_delivery_http_dto.PartyListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.PartyResponse'
        type: array
    type: object
  enterprise-system_internal_delivery_http_dto.PartyResponse:
    properties:
      canonical_party_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      display_name:
        type: string
      id:
        type: string
      organization_profile:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.OrganizationProfileResponse'
      party_type:
        type: string
      person_profile:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.PersonProfileResponse'
      record_status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.PersonProfileResponse:
    properties:
      birth_date:
        type: string
      created_at:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      middle_name:
        type: string
      party_id:
        type: string
      second_last_name:
        type: string
      updated_at:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.RegisterTenantEnvelope:
    properties:
      data:
        $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.RegisterTenantResponse'
    type: object
  enterprise-system_internal_delivery_http_dto.RegisterTenantRequest:
    properties:
      admin_email:
        type: string
      admin_first_name:
        type: string
      admin_last_name:
        type: string
      admin_password:
        minLength: 8
        type: string
      company_name:
        type: string
      slug:
        type: string
      tax_id:
        type: string
    required:
    - admin_email
    - admin_first_name
    - admin_last_name
    - admin_password
    - company_name
    - slug
    - tax_id
    type: object
  enterprise-system_internal_delivery_http_dto.RegisterTenantResponse:
    properties:
      admin_party_id:
        type: string
      organization_party_id:
        type: string
      slug:
        type: string
      tenant_id:
        type: string
    type: object
  enterprise-system_internal_delivery_http_dto.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  enterprise-system_internal_delivery_http_dto.UpdateJobRequest:
    properties:
      code:
        type: string
      description:
        type: string
      job_family_id:
        type: string
      max_salary:
        type: string
      min_salary:
        type: string
      title:
        type: string
    required:
    - code
    - job_family_id
    - title
    type: object
  enterprise-system_internal_delivery_http_dto.Verify2FARequest:
    properties:
      code:
        type: string
      temp_token:
        type: string
    required:
    - code
    - temp_token
    type: object
info:
  contact: {}
  description: Multi-tenant Party Model API with JWT, refresh tokens, 2FA, onboarding
    and password recovery.
  title: Enterprise System API
  version: "1.0"
paths:
  /auth/2fa/verify:
    post:
      consumes:
      - application/json
      description: Validates a TOTP code or a one-time backup code and issues the
        final session tokens.
      parameters:
      - description: Temporary 2FA token and code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.Verify2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.AuthEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      summary: Complete a 2FA login
      tags:
      - Auth
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Requires the current password. Revokes all other sessions and pending
        reset tokens.
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change the authenticated user's password
      tags:
      - Account
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Always returns the same 202 response. If the email exists, a single-use
        reset token is emailed.
      parameters:
      - description: Tenant and email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.MessageEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      summary: Request a password reset
      tags:
      - Account
  /auth/login:
    post:
      consumes:
      - application/json
      description: Validates email/password. If 2FA is enabled, returns a temporary
        token instead of session tokens.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.AuthEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      summary: Authenticate a user
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes the current refresh-token session and clears the cookie.
      responses:
        "204":
          description: No Content
      summary: Logout
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Reads the HttpOnly refresh cookie, revokes the old session and
        issues a new access/refresh pair.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.AuthEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      summary: Rotate the refresh token
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Consumes the reset token, updates the password and revokes all
        sessions.
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      summary: Reset a password with a one-time token
      tags:
      - Account
  /departments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.DepartmentListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List departments
      tags:
      - Departments
    post:
      consumes:
      - application/json
      description: Creates a department and optionally assigns an employee manager.
      parameters:
      - description: Department data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.CreateDepartmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.DepartmentEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a department
      tags:
      - Departments
  /employees:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.EmployeeListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List employees
      tags:
      - Employees
    post:
      consumes:
      - application/json
      description: Converts an existing INDIVIDUAL party into an employee with a job
        and department.
      parameters:
      - description: Employee data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.CreateEmployeeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.EmployeeEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an employee
      tags:
      - Employees
  /health:
    get:
      description: Returns the liveness state of the API server.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.HealthEnvelope'
      summary: Health check
      tags:
      - Health
  /jobs:
    get:
      description: Lists ACTIVE jobs for the authenticated tenant.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.JobListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List jobs
      tags:
      - Jobs
    post:
      consumes:
      - application/json
      description: Creates a tenant-scoped job inside a job family.
      parameters:
      - description: Job data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.CreateJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.JobEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a job
      tags:
      - Jobs
  /jobs/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Job UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated job data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.UpdateJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.JobEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/enterprise-system_internal_delivery_http_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
